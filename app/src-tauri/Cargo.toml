[package]
name = "local-kanban"
version = "1.0.0"
description = "A private, local-first Kanban board for Windows"
authors = ["Local Kanban contributors"]
license = "MIT"
repository = "https://github.com/grayfvll01/local-kanban-board"
edition = "2021"
rust-version = "1.80"

[lib]
name = "local_kanban_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
csv = "1.3.1"
opener = { version = "0.7.2", features = ["reveal"] }
rfd = "0.15.4"
rusqlite = { version = "0.32.1", features = ["backup", "bundled"] }
sanitize-filename = "0.6.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tauri = { version = "2.11.1", features = ["protocol-asset"] }
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.0"
tauri-plugin-updater = "2.13.0"
tauri-plugin-window-state = "2.5.0"
uuid = { version = "1.16.0", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
