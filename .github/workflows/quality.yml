name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Windows app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Verify synchronized version
        run: npm run version:check

      - name: Typecheck UI
        run: npm run typecheck

      - name: Test UI logic
        run: npm test

      - name: Build UI
        run: npm run build:vite

      - name: Check native application
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint native application
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Test native application
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
